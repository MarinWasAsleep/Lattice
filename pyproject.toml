[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-core"
version = "1.0.0"
description = "Lattice Core: the shared image-processing engine of the Lattice suite"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
dependencies = [
    "numpy",
    "numba",
    "Pillow",
]

[project.optional-dependencies]
ui = ["PySide6"]

[tool.setuptools.packages.find]
include = ["lattice_core*"]

[tool.setuptools.package-data]
"lattice_core.palettes" = ["data/*"]
"lattice_core" = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "perf: performance test, informative, not a gate",
    "manual: manual test, never run by gates",
]
