[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice"
version = "1.0.0"
description = "Lattice: dithering, glyph and glitch studio for raster images"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
dependencies = [
    "numpy",
    "numba",
    "Pillow",
]

[project.optional-dependencies]
ui = ["PySide6"]

[project.scripts]
# One console script for the whole suite: `lattice dither render …`, `lattice glyph …`.
lattice = "lattice.cli:main"

[project.gui-scripts]
# One window for the whole suite: the three modes as three tabs.
lattice-studio = "lattice.app:main"

[tool.setuptools.packages.find]
include = ["lattice*"]

[tool.setuptools.package-data]
"lattice.palettes" = ["data/*"]
"lattice" = ["data/*.json"]
"lattice.modes.dither" = ["presets/*.json"]
"lattice.modes.glyph" = ["presets/*.json"]
"lattice.modes.glitch" = ["presets/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "perf: performance test, informative, not a gate",
    "manual: manual test, never run by gates",
]
