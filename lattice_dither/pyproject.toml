[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-dither"
version = "1.0.0"
description = "Lattice Dither: a dithering studio for PhotoCraft"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
dependencies = [
    "lattice-core>=0.1,<0.2",
    "numpy",
    "numba",
    "Pillow",
    "PySide6",
    "imageio-ffmpeg",
]

[tool.setuptools.packages.find]
include = ["lattice_dither*"]

[tool.setuptools.package-data]
"lattice_dither.i18n" = ["*.json"]
